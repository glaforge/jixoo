name: Release Native Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

jobs:
  build-and-release:
    permissions:
      contents: write
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pixoo-cli
            asset_name: pixoo-cli-linux-amd64.zip
          - os: macos-14
            artifact_name: pixoo-cli
            asset_name: pixoo-cli-macos-aarch64.zip
          - os: windows-latest
            artifact_name: pixoo-cli.exe
            asset_name: pixoo-cli-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${RAW_TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$RAW_TAG" >> $GITHUB_ENV
        shell: bash

      - name: Set up Java 21 and GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Update Maven version
        run: mvn -B versions:set "-DnewVersion=${{ env.VERSION }}" -DgenerateBackupPoms=false
        shell: bash

      - name: Build Native Image
        run: mvn -B -Pnative native:compile
        shell: bash

      - name: Zip Artifact (Linux/macOS)
        run: zip -j target/${{ matrix.asset_name }} target/${{ matrix.artifact_name }}
        if: runner.os != 'Windows'

      - name: Zip Artifact (Windows)
        run: Compress-Archive -Path target\${{ matrix.artifact_name }} -DestinationPath target\${{ matrix.asset_name }}
        if: runner.os == 'Windows'

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: target/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
